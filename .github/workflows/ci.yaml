name: CI

# Push só no main (o CD depende deste run); branches de PR rodam via pull_request, para não
# disparar o CI duas vezes no runner self-hosted (nó único rb-lab, disco é o gargalo).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  # Caches no PVC de tool cache do runner (ARC arc-trophy-hunter-api), persistem entre jobs.
  GOMODCACHE: /opt/hostedtoolcache/.go/mod
  GOCACHE: /opt/hostedtoolcache/.go/build
  GOLANGCI_LINT_CACHE: /opt/hostedtoolcache/.golangci-lint

jobs:
  lint:
    name: Lint
    runs-on: arc-trophy-hunter-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
      - name: go vet
        run: go vet ./...

  codegen:
    name: Codegen + contract
    runs-on: arc-trophy-hunter-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # sqlc: o código gerado (db/gen) deve estar sincronizado com db/query + db/migrations.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: sqlc generate + diff
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code db/gen \
            || (echo "::error::db/gen desatualizado — rode 'make gen' e commite"; exit 1)
      # OpenAPI: o contrato é a fonte dos tipos do frontend; lint impede quebra silenciosa.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenAPI lint
        run: npx --yes --registry=https://registry.npmjs.org @redocly/cli@1.34.2 lint api/openapi.yaml

  test:
    name: Build + tests (race)
    runs-on: arc-trophy-hunter-api
    # O runner ARC roda com um sidecar dind (ver k3s-apps infrastructure/arc-runners/chart/
    # values-trophy-hunter-api.yaml) que expõe o daemon em DOCKER_HOST=unix:///var/run/docker.sock.
    # Por isso os testes de integração com testcontainers rodam no CI — sem -short.
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go build
        run: go build ./...
      - name: go test (race, com testcontainers)
        run: go test -race -count=1 ./...
