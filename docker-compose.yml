services:
  postgres:
    image: postgres:16-alpine
    container_name: trophy-hunter-postgres
    environment:
      POSTGRES_USER: trophy
      POSTGRES_PASSWORD: trophy
      POSTGRES_DB: trophy
    ports:
      - "5432:5432"
    volumes:
      - trophy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trophy -d trophy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trophy-hunter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trophy_pgdata:
