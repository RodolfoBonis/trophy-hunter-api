openapi: 3.1.0
info:
  title: Trophy Hunter API
  version: 0.1.0
  description: >
    API pessoal (single-user) para acompanhar conquistas Steam (e, nas próximas fases, troféus
    PSN). Todas as rotas exigem autenticação (Keycloak realm platform, role trophy-hunter-user)
    exceto /healthz, /readyz e /metrics. Em dev (AUTH_MODE=dev) use o header X-Debug-User.
    Publicada como rota do gateway Gravitee em https://api.rodolfodebonis.com.br/trophy (o gateway
    remove /trophy e encaminha para /api no serviço); o PWA chama cross-origin (CORS).
servers:
  - url: https://api.rodolfodebonis.com.br/trophy/v1
    description: Produção (gateway Gravitee).
  - url: http://localhost:8080/api/v1
    description: Dev local.
security:
  - bearerAuth: []
tags:
  - name: me
  - name: integrations
  - name: games
  - name: sync
  - name: push
    description: Web push (VAPID) e preferências de notificação.
  - name: admin
    description: >
      Multiusuário — convites e membros (só o dono). Cada pessoa vê apenas os próprios dados; recursos
      de outra pessoa respondem 404. Guias de troféu são compartilhados (edição privada); roadmap e
      chat são de cada um. Membros têm teto diário de IA (429 code ai_daily_limit).
  - name: social
    description: >
      Recursos entre membros (perfil do amigo, "amigos neste jogo", feed e ranking). OPT-IN e
      RECÍPROCO: só aparece quem ligou PUT /me/sharing, e só vê os outros quem também ligou (senão 403
      code sharing_disabled). Membro que não compartilha é invisível (404). Tudo é só leitura.
  - name: ai
    description: >
      Guias por troféu, roadmap de platina e chat por jogo, gerados por IA (Claude Code headless no
      ai-worker). Gerar é assíncrono — o POST devolve 202 e a resposta chega em tempo real por
      GET /ai/streams/{id} (SSE). Guias e conversas valem para o JOGO (todas as contas).
paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Dados do usuário autenticado.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Exclui a sua conta e todos os dados, na hora (também no Keycloak). O dono não pode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [EXCLUIR] }
      responses:
        "204": { description: Conta excluída }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /me/badges:
    get:
      tags: [me]
      operationId: getMyBadges
      summary: Medalhas do app — ganhas, as próximas, catálogo com andamento e a temporada do mês.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyBadges" }

  /client-errors:
    post:
      tags: [me]
      operationId: reportClientError
      summary: Erro do app no navegador (aberto, sem token; limite por origem). Vira log e métrica.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                kind: { type: string, enum: [render, unhandled, api_contract, network, other] }
                message: { type: string, maxLength: 500 }
                stack: { type: string }
                route: { type: string, description: "Path da tela (sem query)." }
                release: { type: string, description: "Versão do web." }
                user_agent: { type: string }
      responses:
        "204": { description: Registrado }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { description: Limite por origem excedido }

  /me/sharing:
    put:
      tags: [social]
      operationId: putSharing
      summary: Liga/desliga "compartilhar meu progresso com os amigos" (opt-in).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share_progress]
              properties:
                share_progress: { type: boolean }
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/export:
    get:
      tags: [me]
      operationId: exportMe
      summary: Exporta todos os seus dados (LGPD) em JSON. Sem credenciais. Um a cada 10 min.
      responses:
        "200":
          description: Arquivo JSON (Content-Disposition attachment)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountExport" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /social/leaderboard:
    get:
      tags: [social]
      operationId: getLeaderboard
      summary: Placar entre os membros que compartilham (inclui você).
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [month, year, all], default: all }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /social/feed:
    get:
      tags: [social]
      operationId: getFeed
      summary: Platinas, jogos fechados e troféus raros (< 5%) dos membros que compartilham.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /social/friends/{id}:
    get:
      tags: [social]
      operationId: getFriend
      summary: Perfil de um membro que compartilha (resumo igual ao /stats).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendProfile" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /social/friends/{id}/games:
    get:
      tags: [social]
      operationId: listFriendGames
      summary: Biblioteca de um membro que compartilha (só leitura; mesmos filtros do GET /games).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GameStatus" }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [completion, remaining, last_played, title, rarity], default: last_played }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameListPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /social/friends/{id}/badges:
    get:
      tags: [social]
      operationId: getFriendBadges
      summary: Medalhas ganhas de um amigo (só entre quem compartilha; outro caso 403/404).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [earned]
                properties:
                  earned: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /games/{id}/friends:
    get:
      tags: [social]
      operationId: getGameFriends
      summary: Progresso dos amigos (que compartilham) no mesmo jogo — Steam × PSN pelo título.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameFriends" }
        "404": { $ref: "#/components/responses/Problem" }

  /social/challenges:
    get:
      tags: [social]
      operationId: listChallenges
      summary: Desafios de que você participa (abertos primeiro).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChallengeSummary" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [social]
      operationId: createChallenge
      summary: Cria um desafio e convida amigos que compartilham (push para os convidados).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChallengeRequest" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /social/challenges/{id}:
    get:
      tags: [social]
      operationId: getChallenge
      summary: Desafio com o placar ao vivo (só participantes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /social/challenges/{id}/{action}:
    post:
      tags: [social]
      operationId: actChallenge
      summary: "accept/decline (convidado) ou cancel (quem criou, só aberto)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [accept, decline, cancel] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /games/{id}/compare/{friendId}:
    get:
      tags: [social]
      operationId: compareGame
      summary: Seus troféus deste jogo contra os de um amigo que compartilha.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: friendId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameCompare" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /recap:
    get:
      tags: [insights]
      operationId: getRecap
      summary: Retrospectiva ("Wrapped") de um mês ou ano.
      parameters:
        - name: period
          in: query
          description: "AAAA-MM ou AAAA (padrão: mês corrente)."
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }
        "400": { $ref: "#/components/responses/Problem" }

  /recap/weekly:
    get:
      tags: [ai]
      operationId: getWeeklyRecap
      summary: Resumo semanal da IA mais recente (recap null = nunca houve).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recap]
                properties:
                  recap:
                    oneOf:
                      - $ref: "#/components/schemas/WeeklyRecap"
                      - type: "null"
    post:
      tags: [ai]
      operationId: generateWeeklyRecap
      summary: Gera o resumo desta semana agora (se ainda não houver). Não conta no teto diário.
      responses:
        "202":
          description: Pendente ou já existente
          content:
            application/json:
              schema:
                type: object
                required: [recap]
                properties:
                  recap: { $ref: "#/components/schemas/WeeklyRecap" }
        "503": { $ref: "#/components/responses/Problem" }

  /integrations:
    get:
      tags: [integrations]
      operationId: listIntegrations
      summary: Lista as integrações conectadas (nunca retorna segredos).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Problem" }

  /integrations/steam:
    post:
      tags: [integrations]
      operationId: connectSteam
      summary: Conecta uma nova conta Steam.
      description: >
        Várias contas por plataforma são suportadas. Valida o SteamID64/vanity contra a Steam,
        grava as credenciais cifradas e enfileira um full sync. api_key é opcional quando já existe
        outra conta Steam (a Steam Web API key lê qualquer perfil público e é reaproveitada). O
        perfil e os detalhes de jogos devem ser públicos. Nunca retorna a API key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectSteamRequest" }
      responses:
        "201":
          description: Conta conectada; full sync enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502":
          description: Falha ao validar com a Steam (chave inválida, perfil privado, etc.).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /integrations/psn:
    post:
      tags: [integrations]
      operationId: connectPSN
      summary: Conecta uma conta PSN pelo NPSSO.
      description: >
        Troca o NPSSO (cookie do login em playstation.com; ver https://ca.account.sony.com/api/v1/ssocookie)
        por access/refresh tokens e enfileira um full sync. O NPSSO nunca é gravado nem retornado; as
        renovações usam só o refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectPSNRequest" }
      responses:
        "201":
          description: Conta conectada; full sync enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /integrations/{id}/reconnect:
    post:
      tags: [integrations]
      operationId: reconnectIntegration
      summary: Reconecta uma conta PSN expirada com um NPSSO novo (precisa ser a mesma conta).
      parameters:
        - $ref: "#/components/parameters/IntegrationIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [npsso]
              properties:
                npsso: { type: string }
      responses:
        "200":
          description: Reconectada; sync incremental enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /integrations/{id}:
    patch:
      tags: [integrations]
      operationId: updateIntegration
      summary: Renomeia a conta e/ou troca a API key.
      parameters:
        - $ref: "#/components/parameters/IntegrationIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIntegrationRequest" }
      responses:
        "200":
          description: Conta atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502":
          description: A Steam rejeitou a nova API key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [integrations]
      operationId: deleteIntegration
      summary: Remove a conta e os jogos/troféus dela.
      parameters:
        - $ref: "#/components/parameters/IntegrationIDPath"
      responses:
        "204": { description: Removida. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /integrations/{id}/sync:
    post:
      tags: [sync]
      operationId: syncIntegration
      summary: Enfileira uma sincronização da conta.
      parameters:
        - $ref: "#/components/parameters/IntegrationIDPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "202":
          description: Sincronização enfileirada (ou já havia uma pendente — ver enqueued).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnqueueResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /games/{id}/sync:
    post:
      tags: [sync]
      operationId: syncGame
      summary: Enfileira a sincronização de um único jogo.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "202":
          description: Sincronização do jogo enfileirada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnqueueResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /sync-runs:
    get:
      tags: [sync]
      operationId: listSyncRuns
      summary: Log de execuções de sincronização.
      parameters:
        - name: platform
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Platform" }
        - name: integration_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncRun" }
        "401": { $ref: "#/components/responses/Problem" }

  /games:
    get:
      tags: [games]
      operationId: listGames
      summary: Lista a biblioteca com filtros, ordenação e paginação.
      parameters:
        - name: platform
          in: query
          schema: { $ref: "#/components/schemas/Platform" }
        - name: integration_id
          in: query
          description: Restringe a biblioteca a UMA conta (default — todas, um item por jogo).
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GameStatus" }
        - name: q
          in: query
          description: Busca por título (case-insensitive, substring).
          schema: { type: string }
        - name: has_achievements
          in: query
          description: >
            Filtra por jogos com/sem conquistas. Default true. Use "all" para não filtrar.
          schema:
            type: string
            enum: ["true", "false", "all"]
            default: "true"
        - name: sort
          in: query
          schema:
            type: string
            enum: [completion, remaining, last_played, title, rarity]
            default: last_played
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameListPage" }
        "401": { $ref: "#/components/responses/Problem" }

  /games/{id}:
    patch:
      tags: [annotations]
      operationId: patchGame
      summary: Marcações do usuário no jogo (abandonado, prioridade, notas, tags).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Annotations" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [games]
      operationId: getGame
      summary: Detalhe do jogo com grupos, troféus e progresso.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }


  /games/{id}/link:
    post:
      tags: [games]
      operationId: linkGame
      summary: Vincula o jogo ao mesmo título na OUTRA plataforma (Steam ↔ PSN).
      description: >
        Vale para todas as contas que possuem cada jogo e trava a decisão — a unificação automática
        (match exato de título normalizado) não desfaz nem refaz vínculos manuais.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkGameRequest" }
      responses:
        "204": { description: Vinculado }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [games]
      operationId: unlinkGame
      summary: Desfaz o vínculo cross-platform do jogo (decisão travada).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "204": { description: Desvinculado }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /games/{id}/link-candidates:
    get:
      tags: [games]
      operationId: linkCandidates
      summary: Jogos da OUTRA plataforma para vincular, por similaridade de título (até 10).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
        - name: q
          in: query
          description: Busca por título (padrão = título do jogo).
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrossPlatformGame" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /stats:
    get:
      tags: [insights]
      operationId: getStats
      summary: Resumo do dashboard (cada jogo conta uma vez, pela conta mais avançada).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Problem" }

  /next:
    get:
      tags: [insights]
      operationId: getNext
      summary: Fila "Próxima Platina" (ranking) e a sugestão "o que fazer hoje".
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextPlatinum" }
        "401": { $ref: "#/components/responses/Problem" }

  /timeline:
    get:
      tags: [insights]
      operationId: getTimeline
      summary: Desbloqueios de todas as contas, do mais recente (paginação por cursor).
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /alerts:
    get:
      tags: [insights]
      operationId: getAlerts
      summary: Troféus que faltam marcados como perdíveis/online/dificuldade (ou com risco de servidor fechar).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Problem" }

  /trophies/{id}:
    patch:
      tags: [annotations]
      operationId: patchTrophy
      summary: Marcações do usuário no troféu (tags, notas, prioridade, risco de servidor).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Annotations" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trophy" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /trophies/{id}/guide:
    get:
      tags: [ai]
      operationId: getTrophyGuide
      summary: Guia de IA do troféu (null se ainda não gerado).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGuideEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [ai]
      operationId: generateTrophyGuide
      summary: Gera (ou regenera) o guia do troféu. A edição do usuário é preservada.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "202":
          description: Na fila — acompanhe em /ai/streams/{guide.id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGuide" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /games/{id}/hunt:
    get:
      tags: [ai]
      operationId: getHunt
      summary: Modo caçada — etapas do roadmap ligadas aos troféus reais, marcas da pessoa e se há sync rodando.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hunt" }
        "404": { $ref: "#/components/responses/Problem" }

  /games/{id}/hunt/stages/{idx}:
    put:
      tags: [ai]
      operationId: putHuntStage
      summary: Marca/desmarca uma etapa do modo caçada como feita.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idx, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 99 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /games/{id}/roadmap:
    get:
      tags: [ai]
      operationId: getRoadmap
      summary: Roadmap de platina/100% do jogo (null se ainda não gerado).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGuideEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [ai]
      operationId: generateRoadmap
      summary: Gera (ou regenera) o roadmap a partir do progresso atual.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "202":
          description: Na fila — acompanhe em /ai/streams/{guide.id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGuide" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /ai/guides/{id}:
    patch:
      tags: [ai]
      operationId: editGuide
      summary: Grava a correção do usuário (mesmo schema do guia) ou null para voltar ao gerado.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edited_content]
              properties:
                edited_content:
                  oneOf:
                    - { $ref: "#/components/schemas/TrophyGuideContent" }
                    - { $ref: "#/components/schemas/RoadmapContent" }
                    - { type: "null" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGuide" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /games/{id}/chat:
    get:
      tags: [ai]
      operationId: getChat
      summary: Conversa ativa do jogo.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThread" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [ai]
      operationId: sendChat
      summary: Envia uma pergunta; a resposta chega por /ai/streams/{assistant.id}. Uma por vez.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000 }
      responses:
        "202":
          description: Na fila.
          content:
            application/json:
              schema:
                type: object
                required: [user, assistant]
                properties:
                  user: { $ref: "#/components/schemas/ChatMessage" }
                  assistant: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [ai]
      operationId: resetChat
      summary: Arquiva a conversa (a próxima pergunta começa do zero).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "204": { description: Arquivada }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /ai/streams/{id}:
    get:
      tags: [ai]
      operationId: aiStream
      summary: Resposta da IA em tempo real (Server-Sent Events).
      description: >
        id = guia ou mensagem do assistente. Eventos (data = JSON {"data": string}): `text` (pedaço
        do chat), `json` (pedaço do JSON do guia), `tool` ("Pesquisando: …"), `status` (aviso),
        `ping` (heartbeat a cada 5 s) e os finais `done` (resultado no GET correspondente) e
        `error` (mensagem). Retoma do header Last-Event-ID. Use fetch (o header Authorization não
        cabe em EventSource).
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Stream SSE.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /events/unseen:
    get:
      tags: [games]
      operationId: listUnseenUnlocks
      summary: Troféus desbloqueados ainda não exibidos (avisos/cerimônia), mais antigos primeiro (até 100).
      description: >
        Só desbloqueios detectados DEPOIS do sync inicial de cada conta. completes_game = o troféu
        fechou o jogo (PSN: platina; Steam: 100%).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnlockEvent" }
        "401": { $ref: "#/components/responses/Problem" }

  /events/seen:
    post:
      tags: [games]
      operationId: markUnlocksSeen
      summary: Marca avisos como exibidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
      responses:
        "204": { description: Marcados }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /push/key:
    get:
      tags: [push]
      operationId: pushStatus
      summary: Se o web push está ligado, a chave pública VAPID e quantos aparelhos estão inscritos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushStatus" }
        "401": { $ref: "#/components/responses/Problem" }

  /push/subscriptions:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Grava (ou atualiza) a inscrição deste navegador (PushSubscription.toJSON()).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "201": { description: Inscrito }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [push]
      operationId: unsubscribePush
      summary: Remove a inscrição deste navegador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Removida }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /push/test:
    post:
      tags: [push]
      operationId: testPush
      summary: Envia agora uma notificação de teste para todos os aparelhos.
      responses:
        "200":
          description: Resultado do envio
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed, removed]
                properties:
                  sent: { type: integer }
                  failed: { type: integer }
                  removed: { type: integer, description: "Inscrições expiradas (404/410) removidas." }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /notifications/preferences:
    get:
      tags: [push]
      operationId: getNotificationPreferences
      summary: Quais tipos de notificação estão ligados (padrão = todos).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [push]
      operationId: putNotificationPreferences
      summary: Grava as preferências (objeto completo).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /search:
    get:
      tags: [games]
      operationId: search
      summary: Busca da paleta de comandos — jogos (até 8) e troféus (até 12). Mínimo de 2 caracteres.
      description: >
        Só a conta mais avançada de cada jogo. Troféus ocultos ainda não obtidos não aparecem.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /invites/{code}/accept:
    post:
      tags: [me]
      operationId: acceptInvite
      summary: Aceita um convite — quem está "pending" (ou foi removido sem purge) vira membro ativo.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Membro ativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/invites:
    post:
      tags: [admin]
      operationId: createInvite
      summary: Cria um link de convite (uso único, válido por 7 dias). Só o dono.
      responses:
        "201":
          description: Convite criado (url só aparece aqui)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      tags: [admin]
      operationId: listInvites
      summary: Convites ainda válidos. Só o dono.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/invites/{id}:
    delete:
      tags: [admin]
      operationId: revokeInvite
      summary: Revoga um convite. Só o dono.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
      responses:
        "204": { description: Revogado }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/members:
    get:
      tags: [admin]
      operationId: listMembers
      summary: Quem já entrou (ativos e removidos), dono primeiro. Só o dono.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/members/{id}:
    delete:
      tags: [admin]
      operationId: removeMember
      summary: Revoga o acesso de um membro; com purge=true apaga a pessoa e todos os dados dela.
      parameters:
        - $ref: "#/components/parameters/GameIDPath"
        - name: purge
          in: query
          schema: { type: boolean }
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IntegrationIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Erro no formato application/problem+json (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Badge:
      type: object
      required: [key, name, description, tier, value, goal, earned]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        tier: { type: string, enum: [bronze, silver, gold, platinum] }
        season: { type: string, description: "YYYY-MM nas medalhas de temporada" }
        earned_at: { type: string, format: date-time }
        value: { type: integer }
        goal: { type: integer }
        earned: { type: boolean }
    MyBadges:
      type: object
      required: [earned, next, catalog, season]
      properties:
        earned: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        next: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        catalog: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        season:
          type: object
          required: [key, label, platinums, rare, platinum_goal, rare_goal, done]
          properties:
            key: { type: string }
            label: { type: string }
            platinums: { type: integer }
            rare: { type: integer }
            platinum_goal: { type: integer }
            rare_goal: { type: integer }
            done: { type: boolean }
    Hunt:
      type: object
      required: [roadmap, syncing, missables_overview, stages]
      properties:
        roadmap: { type: string, enum: [none, pending, running, ready, error] }
        syncing: { type: boolean }
        missables_overview: { type: array, items: { type: string } }
        stages:
          type: array
          items:
            type: object
            required: [index, title, description, missables, trophy_ids, unmatched, earned, done, complete]
            properties:
              index: { type: integer }
              title: { type: string }
              description: { type: string }
              missables: { type: array, items: { type: string } }
              trophy_ids: { type: array, items: { type: string, format: uuid } }
              unmatched: { type: array, items: { type: string } }
              earned: { type: integer }
              done: { type: boolean }
              complete: { type: boolean }
    AccountExport:
      type: object
      required: [format, exported_at, profile, accounts, games, trophies, ai, chats, challenges]
      properties:
        format: { type: string, example: trophy-hunter-export/1 }
        exported_at: { type: string, format: date-time }
        profile:
          type: object
          properties:
            email: { type: string }
            name: { type: string }
            role: { type: string }
            share_progress: { type: boolean }
            created_at: { type: [string, "null"], format: date-time }
            last_seen_at: { type: [string, "null"], format: date-time }
        accounts: { type: array, items: { type: object, additionalProperties: true } }
        games: { type: array, items: { type: object, additionalProperties: true } }
        trophies: { type: array, items: { type: object, additionalProperties: true } }
        ai: { type: object, additionalProperties: true }
        chats: { type: array, items: { type: object, additionalProperties: true } }
        challenges: { type: array, items: { type: object, additionalProperties: true } }
        notification_preferences: { type: object, additionalProperties: true }
        push_devices: { type: integer }
    SearchResult:
      type: object
      required: [games, trophies]
      properties:
        games:
          type: array
          items:
            type: object
            required: [id, title, platform, external_id, cover, hero, completion_pct]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              completion_pct: { type: number }
        trophies:
          type: array
          items:
            type: object
            required: [id, name, type, icon, earned, rarity_pct, game_id, game_title, platform]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { $ref: "#/components/schemas/TrophyType" }
              icon: { type: string }
              earned: { type: boolean }
              rarity_pct: { type: [number, "null"] }
              game_id: { type: string, format: uuid }
              game_title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
    PushStatus:
      type: object
      required: [enabled, public_key, subscriptions]
      properties:
        enabled: { type: boolean, description: "false = chaves VAPID não configuradas no servidor." }
        public_key: { type: string, description: "applicationServerKey (base64url)." }
        subscriptions: { type: integer }
    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, description: "URL https do push service do navegador." }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [unlocks, completions, reconnect, ai_ready, challenges, weekly_recap]
      properties:
        unlocks: { type: boolean, description: "Troféus novos." }
        completions: { type: boolean, description: "Platina / 100%." }
        reconnect: { type: boolean, description: "Conta precisa de ação (reautenticar a PSN, perfil Steam privado)." }
        ai_ready: { type: boolean, description: "Guia/roadmap pronto." }
        challenges: { type: boolean, description: "Desafios entre amigos (convite, avanço, resultado)." }
        weekly_recap: { type: boolean, description: "Resumo semanal da IA (domingo à noite). Opt-in: liga a geração e o aviso." }
    UnlockEvent:
      type: object
      required: [id, detected_at, trophy_id, name, description, type, icon, rarity_pct, earned_at, game_id, game_title, platform, external_id, cover, hero, completes_game]
      properties:
        id: { type: string, format: uuid }
        detected_at: { type: [string, "null"], format: date-time }
        trophy_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/TrophyType" }
        icon: { type: string }
        rarity_pct: { type: [number, "null"] }
        earned_at: { type: [string, "null"], format: date-time }
        game_id: { type: string, format: uuid }
        game_title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        external_id: { type: string }
        cover: { type: string }
        hero: { type: string }
        completes_game: { type: boolean, description: "Fechou o jogo (platina/100%) → cerimônia." }
    AIGuideEnvelope:
      type: object
      required: [guide]
      properties:
        guide:
          oneOf:
            - { $ref: "#/components/schemas/AIGuide" }
            - { type: "null" }
    AIGuide:
      type: object
      description: >
        Guia de IA. content = gerado (validado pelo schema do escopo); edited_content = correção do
        usuário (a UI mostra a editada quando existe). status pending/running = gerando.
      required: [id, scope, status, content, edited_content, model, error, generated_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [trophy, roadmap] }
        status: { type: string, enum: [pending, running, ready, error] }
        content:
          description: TrophyGuideContent (scope trophy) ou RoadmapContent (scope roadmap).
          oneOf:
            - { $ref: "#/components/schemas/TrophyGuideContent" }
            - { $ref: "#/components/schemas/RoadmapContent" }
            - { type: "null" }
        edited_content:
          oneOf:
            - { $ref: "#/components/schemas/TrophyGuideContent" }
            - { $ref: "#/components/schemas/RoadmapContent" }
            - { type: "null" }
        model: { type: string }
        error: { type: string, description: "Mensagem exibível quando status = error." }
        generated_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    TrophyGuideContent:
      type: object
      additionalProperties: false
      required: [summary, steps, prerequisites, missable, point_of_no_return, difficulty, estimated_time, tips, confidence, uncertainty_notes, sources]
      properties:
        where: { type: string, description: "Onde o troféu sai (capítulo/fase/área). Ausente em guias v1." }
        summary: { type: string }
        steps: { type: array, minItems: 1, items: { type: string } }
        prerequisites: { type: array, items: { type: string } }
        missable: { type: boolean }
        point_of_no_return: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 10 }
        estimated_time: { type: string }
        tips: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        uncertainty_notes: { type: string }
        sources: { type: array, items: { type: string } }
    RoadmapStage:
      type: object
      additionalProperties: false
      required: [title, description, trophies, missables]
      properties:
        title: { type: string }
        description: { type: string }
        trophies: { type: array, items: { type: string } }
        missables: { type: array, items: { type: string } }
    RoadmapContent:
      type: object
      additionalProperties: false
      required: [summary, difficulty, estimated_total_time, playthroughs, stages, missables_overview, tips, confidence, uncertainty_notes, sources]
      properties:
        summary: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 10 }
        estimated_total_time: { type: string }
        playthroughs: { type: integer, minimum: 1 }
        stages: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RoadmapStage" } }
        missables_overview: { type: array, items: { type: string } }
        tips: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        uncertainty_notes: { type: string }
        sources: { type: array, items: { type: string } }
    ChatMessage:
      type: object
      required: [id, role, content, status, error, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        status: { type: string, enum: [pending, running, done, error] }
        error: { type: string }
        created_at: { type: [string, "null"], format: date-time }
    ChatThread:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
    Platform:
      type: string
      enum: [steam, psn]
    IntegrationStatus:
      type: string
      enum: [connected, needs_reconnect, error_private, error, disabled]
    GameStatus:
      type: string
      enum: [completed, platinum, almost, in_progress, not_started, abandoned]
    TrophyType:
      type: string
      enum: [platinum, gold, silver, bronze, achievement]
    TrophyTag:
      type: string
      enum: [missable, online, grind, difficulty, collectible, buggy]
    SyncScope:
      type: string
      enum: [full, incremental]
    User:
      type: object
      description: >
        Usuário do app. status pending = logou mas ainda não aceitou convite (só /me e o aceite
        funcionam; o resto responde 403 code not_invited); removed = acesso revogado pelo dono.
      required: [id, subject, email, name, role, status, share_progress]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [pending, active, removed] }
        share_progress:
          type: boolean
          description: Compartilha o progresso com os outros membros (e vê o deles). Opt-in, começa false.
    Recap:
      type: object
      description: Retrospectiva do período (calculada na hora; fuso de Brasília; jogos pela conta mais avançada).
      required: [period, label, partial, earned, previous_earned, platinum, gold, silver, bronze, achievements, rare, games, active_days, longest_streak, favorite_weekday, best_day, best_day_count, top_games, rarest, completions]
      properties:
        period: { type: string, example: "2026-10" }
        label: { type: string, example: "outubro de 2026" }
        partial: { type: boolean, description: "O período ainda não acabou." }
        earned: { type: integer }
        previous_earned: { type: integer, description: "Mesmo total no período anterior." }
        platinum: { type: integer }
        gold: { type: integer }
        silver: { type: integer }
        bronze: { type: integer }
        achievements: { type: integer }
        rare: { type: integer }
        games: { type: integer }
        active_days: { type: integer }
        longest_streak: { type: integer }
        favorite_weekday: { type: string }
        best_day: { type: [string, "null"], format: date-time }
        best_day_count: { type: integer }
        top_games:
          type: array
          items:
            type: object
            required: [game_id, title, platform, external_id, cover, hero, unlocked, earned, total]
            properties:
              game_id: { type: string, format: uuid }
              title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              unlocked: { type: integer }
              earned: { type: integer }
              total: { type: integer }
        rarest:
          type: array
          items:
            type: object
            required: [name, type, hidden, icon, rarity_pct, earned_at, game_title, platform]
            properties:
              name: { type: string }
              type: { $ref: "#/components/schemas/TrophyType" }
              hidden: { type: boolean }
              icon: { type: string }
              rarity_pct: { type: number }
              earned_at: { type: [string, "null"], format: date-time }
              game_title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
        completions:
          type: array
          items:
            type: object
            required: [game_id, title, platform, external_id, cover, hero, total]
            properties:
              game_id: { type: string, format: uuid }
              title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              total: { type: integer }
              completed_at: { type: [string, "null"], format: date-time }
    WeeklyRecapContent:
      type: object
      required: [headline, highlights, suggestions, encouragement]
      properties:
        headline: { type: string }
        highlights: { type: array, items: { type: string } }
        suggestions:
          type: array
          items:
            type: object
            required: [game, why, trophies]
            properties:
              game: { type: string }
              why: { type: string }
              trophies: { type: array, items: { type: string } }
        encouragement: { type: string }
    WeeklyRecap:
      type: object
      required: [week, status, content, error, updated_at]
      properties:
        week: { type: string, format: date, description: "Segunda-feira da semana." }
        status: { type: string, enum: [pending, ready, error] }
        content:
          oneOf:
            - $ref: "#/components/schemas/WeeklyRecapContent"
            - type: "null"
        error: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    ChallengeGame:
      type: object
      required: [title, platform, external_id, cover]
      properties:
        title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        external_id: { type: string }
        cover: { type: string }
    ChallengeSummary:
      type: object
      required: [id, kind, title, status, starts_at, ends_at, my_state, is_creator, accepted_count, winner_name, game]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [first_to_complete, most_trophies, most_rare] }
        title: { type: string }
        status: { type: string, enum: [open, finished, canceled] }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time, description: "null = sem prazo (só first_to_complete)." }
        my_state: { type: string, enum: [invited, accepted, declined] }
        is_creator: { type: boolean }
        accepted_count: { type: integer }
        winner_name: { type: [string, "null"] }
        game:
          oneOf:
            - $ref: "#/components/schemas/ChallengeGame"
            - type: "null"
    ChallengeStanding:
      type: object
      required: [user, state, score, has_game, earned, total, completion_pct, completed_at]
      properties:
        user: { $ref: "#/components/schemas/SocialUser" }
        state: { type: string, enum: [invited, accepted, declined] }
        score: { type: integer, description: "most_*: troféus (ou raros) obtidos na janela." }
        has_game: { type: boolean }
        earned: { type: integer }
        total: { type: integer }
        completion_pct: { type: number }
        completed_at: { type: [string, "null"], format: date-time }
    ChallengeDetail:
      allOf:
        - $ref: "#/components/schemas/ChallengeSummary"
        - type: object
          required: [finished_at, winner, standings]
          properties:
            finished_at: { type: [string, "null"], format: date-time }
            winner:
              oneOf:
                - $ref: "#/components/schemas/SocialUser"
                - type: "null"
            standings: { type: array, items: { $ref: "#/components/schemas/ChallengeStanding" } }
    CreateChallengeRequest:
      type: object
      required: [kind, friend_ids]
      properties:
        kind: { type: string, enum: [first_to_complete, most_trophies, most_rare] }
        friend_ids: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: uuid } }
        game_id: { type: string, format: uuid, description: "Seu jogo (first_to_complete)." }
        days: { type: integer, description: "most_*: 7, 14 ou 30 (padrão 7). first_to_complete: prazo opcional 7/14/30/60/90." }
        title: { type: string, maxLength: 80 }
    CompareTrophy:
      type: object
      required: [trophy_id, name, description, type, hidden, icon, rarity_pct, mine, mine_earned_at, friend, friend_earned_at, matched]
      properties:
        trophy_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/TrophyType" }
        hidden: { type: boolean }
        icon: { type: string }
        rarity_pct: { type: [number, "null"] }
        mine: { type: boolean }
        mine_earned_at: { type: [string, "null"], format: date-time }
        friend: { type: boolean }
        friend_earned_at: { type: [string, "null"], format: date-time }
        matched: { type: boolean, description: "O troféu existe na versão do amigo (Steam × PSN casam pelo nome)." }
    GameCompare:
      type: object
      required: [friend, same_platform, friend_platform, friend_earned, friend_total, friend_completion_pct, trophies]
      properties:
        friend: { $ref: "#/components/schemas/SocialUser" }
        same_platform: { type: boolean }
        friend_platform: { $ref: "#/components/schemas/Platform" }
        friend_earned: { type: integer }
        friend_total: { type: integer }
        friend_completion_pct: { type: number }
        trophies: { type: array, items: { $ref: "#/components/schemas/CompareTrophy" } }
    SocialUser:
      type: object
      required: [id, name, is_me]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_me: { type: boolean }
    LeaderboardItem:
      type: object
      required: [user, platinum, earned, rare, psn_points, completed, last_unlock_at, badges]
      properties:
        user: { $ref: "#/components/schemas/SocialUser" }
        platinum: { type: integer }
        earned: { type: integer, description: Troféus/conquistas obtidos no período. }
        rare: { type: integer, description: Obtidos com raridade < 5%. }
        psn_points: { type: integer, description: "Pontos PSN (15/30/90/300) no período." }
        completed: { type: integer, description: Jogos fechados (platina/100%) no período. }
        last_unlock_at: { type: [string, "null"], format: date-time }
        badges: { type: integer, description: "Medalhas do app ganhas" }
    Leaderboard:
      type: object
      required: [period, items]
      properties:
        period: { type: string, enum: [month, year, all] }
        items: { type: array, items: { $ref: "#/components/schemas/LeaderboardItem" } }
    FeedItem:
      type: object
      required: [user, kind, trophy_id, name, description, type, hidden, icon, rarity_pct, earned_at,
                 game_title, platform, external_id, cover, hero, completes_game]
      properties:
        user: { $ref: "#/components/schemas/SocialUser" }
        kind: { type: string, enum: [platinum, completion, rare] }
        trophy_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"], description: "null em troféu oculto (spoiler)." }
        type: { $ref: "#/components/schemas/TrophyType" }
        hidden: { type: boolean }
        icon: { type: string }
        rarity_pct: { type: [number, "null"] }
        earned_at: { type: [string, "null"], format: date-time }
        game_title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        external_id: { type: string }
        cover: { type: string }
        hero: { type: string }
        completes_game: { type: boolean }
    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
        next_cursor: { type: [string, "null"] }
    FriendProfile:
      type: object
      required: [user, stats]
      properties:
        user: { $ref: "#/components/schemas/SocialUser" }
        stats: { $ref: "#/components/schemas/Stats" }
    GameFriend:
      type: object
      required: [user, platform, earned, total, completion_pct, has_platinum, last_unlock_at]
      properties:
        user: { $ref: "#/components/schemas/SocialUser" }
        platform: { $ref: "#/components/schemas/Platform" }
        earned: { type: integer }
        total: { type: integer }
        completion_pct: { type: number }
        has_platinum: { type: boolean }
        last_unlock_at: { type: [string, "null"], format: date-time }
    GameFriends:
      type: object
      required: [sharing, items]
      properties:
        sharing: { type: boolean, description: "false = quem pede não compartilha (items vazio)." }
        items: { type: array, items: { $ref: "#/components/schemas/GameFriend" } }
    Invite:
      type: object
      required: [id, expires_at, max_uses, used_count, created_at]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: [string, "null"], format: date-time }
        max_uses: { type: integer }
        used_count: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        url: { type: string, description: "Link do convite — só na criação (o código não fica guardado)." }
    Member:
      type: object
      required: [id, email, name, role, status, accounts, last_seen_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [pending, active, removed] }
        accounts: { type: integer, description: "Contas Steam/PSN conectadas." }
        last_seen_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
    Integration:
      type: object
      required: [id, platform, label, status]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        label: { type: string, description: "Apelido da conta no app (ex.: Principal, Alt)." }
        status: { $ref: "#/components/schemas/IntegrationStatus" }
        account_id: { type: string }
        display_name: { type: string }
        avatar: { type: string }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
    ConnectSteamRequest:
      type: object
      required: [steam_id_or_vanity]
      properties:
        label:
          type: string
          maxLength: 40
          description: Apelido da conta. Vazio → nome do perfil na Steam.
        api_key:
          type: string
          description: >
            Steam Web API key (https://steamcommunity.com/dev/apikey). Opcional: omitida → usa a key de
            outra conta Steam da mesma pessoa ou a key do servidor (basta informar o perfil). Nunca é
            retornada.
        steam_id_or_vanity:
          type: string
          description: SteamID64 (17 dígitos) ou a vanity URL (nome do perfil).
    ConnectPSNRequest:
      type: object
      required: [npsso]
      properties:
        label: { type: string, maxLength: 40, description: "Apelido; vazio → online ID." }
        npsso: { type: string, description: "Cookie npsso do login em playstation.com. Nunca é gravado." }
    UpdateIntegrationRequest:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        api_key: { type: string, description: "Nova Steam Web API key (validada contra a conta)." }
    SyncRequest:
      type: object
      properties:
        scope:
          allOf:
            - $ref: "#/components/schemas/SyncScope"
          default: incremental
    EnqueueResponse:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: boolean
          description: false quando já havia um job idêntico pendente (dedupe).
        job_id: { type: [string, "null"], format: uuid }
    SyncRun:
      type: object
      required: [id, platform, scope, trigger, status, started_at]
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: [string, "null"], format: uuid, description: "Conta do run (null se removida)." }
        platform: { $ref: "#/components/schemas/Platform" }
        scope:
          type: string
          enum: [full, incremental, game]
        trigger:
          type: string
          enum: [schedule, manual]
        status:
          type: string
          enum: [running, ok, error]
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        items_changed: { type: integer }
        games_total: { type: integer, description: "Jogos a sincronizar no run (fan-out)." }
        games_done: { type: integer, description: "Jogos cujo sync terminou (sucesso ou falha)." }
        games_failed: { type: integer, description: "Jogos cujo sync falhou." }
        error: { type: string }
    ProgressSummary:
      type: object
      required: [total, earned, remaining, completion_pct, status]
      properties:
        total: { type: integer }
        earned: { type: integer }
        remaining: { type: integer }
        completion_pct:
          type: number
          format: double
          description: Fração concluída por contagem (0..1).
        status: { $ref: "#/components/schemas/GameStatus" }
        has_platinum: { type: boolean }
        platinum_earned: { type: boolean }
    ProgressDetail:
      allOf:
        - $ref: "#/components/schemas/ProgressSummary"
        - type: object
          properties:
            by_type:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/TypeCount"
            base:
              $ref: "#/components/schemas/ProgressBucket"
            dlc:
              $ref: "#/components/schemas/ProgressBucket"
    TypeCount:
      type: object
      required: [total, earned]
      properties:
        total: { type: integer }
        earned: { type: integer }
    ProgressBucket:
      type: object
      required: [total, earned, remaining]
      properties:
        total: { type: integer }
        earned: { type: integer }
        remaining: { type: integer }
    Game:
      type: object
      required: [id, platform, external_id, title, has_achievements]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        external_id: { type: string }
        np_service_name: { type: [string, "null"] }
        title: { type: string }
        icon: { type: string }
        cover: { type: string }
        hero: { type: string, description: "Arte horizontal (Steam header). Vazio → use cover." }
        platforms:
          type: array
          items: { type: string }
        has_achievements: { type: boolean }
        has_platinum: { type: boolean }
        last_played_at: { type: [string, "null"], format: date-time }
        playtime_minutes: { type: integer }
        abandoned: { type: boolean }
        priority: { type: integer }
        notes: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TrophyTag" }
    Annotations:
      type: object
      description: Só os campos enviados mudam. abandoned só vale para jogos.
      properties:
        abandoned: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 3 }
        notes: { type: string, maxLength: 4000 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TrophyTag" }
        server_shutdown_risk: { type: boolean }
    Stats:
      type: object
      required: [games, trophies, rarest, completions, evolution]
      properties:
        games:
          type: object
          required: [total, completed, almost, in_progress, not_started, abandoned]
          properties:
            total: { type: integer }
            completed: { type: integer }
            almost: { type: integer }
            in_progress: { type: integer }
            not_started: { type: integer }
            abandoned: { type: integer }
        trophies:
          type: object
          required: [total, earned, platinum, gold, silver, bronze, rarity]
          properties:
            total: { type: integer }
            earned: { type: integer }
            platinum: { $ref: "#/components/schemas/TypeCount" }
            gold: { $ref: "#/components/schemas/TypeCount" }
            silver: { $ref: "#/components/schemas/TypeCount" }
            bronze: { $ref: "#/components/schemas/TypeCount" }
            rarity: { $ref: "#/components/schemas/RarityEarned" }
        rarest:
          type: array
          items:
            type: object
            required: [id, name, type, icon, rarity_pct, game_id, game_title, platform]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { $ref: "#/components/schemas/TrophyType" }
              icon: { type: string }
              rarity_pct: { type: number }
              earned_at: { type: [string, "null"], format: date-time }
              game_id: { type: string, format: uuid }
              game_title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
        completions:
          type: array
          items:
            type: object
            required: [game_id, title, platform, external_id, cover, hero, total]
            properties:
              game_id: { type: string, format: uuid }
              title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              total: { type: integer }
              completed_at: { type: [string, "null"], format: date-time }
        evolution:
          type: array
          items:
            type: object
            required: [month, earned, cumulative]
            properties:
              month: { type: string, description: "YYYY-MM" }
              earned: { type: integer }
              cumulative: { type: integer }
    RemainingTrophy:
      type: object
      required: [id, name, type, hidden, icon, icon_locked, tags]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/TrophyType" }
        hidden: { type: boolean }
        icon: { type: string }
        icon_locked: { type: string }
        rarity_pct: { type: [number, "null"] }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TrophyTag" }
    NextPlatinum:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [game_id, title, platform, external_id, cover, hero, earned, total, remaining, completion_pct, avg_remaining_rarity, min_remaining_rarity, remaining_missable, remaining_online, priority, hours_total, hours_left, score, factors]
            properties:
              game_id: { type: string, format: uuid }
              title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              earned: { type: integer }
              total: { type: integer }
              remaining: { type: integer }
              completion_pct: { type: number }
              avg_remaining_rarity: { type: number }
              min_remaining_rarity: { type: number }
              remaining_missable: { type: integer }
              remaining_online: { type: integer }
              priority: { type: integer }
              last_unlock_at: { type: [string, "null"], format: date-time }
              hours_total: { type: [number, "null"], description: "Horas para 100% (HowLongToBeat); null = sem estimativa." }
              hours_left: { type: [number, "null"], description: "Horas que faltam (proporcional ao progresso)." }
              score: { type: number }
              factors:
                type: object
                required: [completion, remaining, ease, priority, urgency, time]
                properties:
                  completion: { type: number }
                  remaining: { type: number }
                  ease: { type: number }
                  priority: { type: number }
                  urgency: { type: number }
                  time: { type: number, description: "Bônus de poucas horas restantes (0 sem estimativa)." }
        today:
          type: [object, "null"]
          required: [game_id, trophies]
          properties:
            game_id: { type: string, format: uuid }
            trophies:
              type: array
              items: { $ref: "#/components/schemas/RemainingTrophy" }
    TimelinePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [trophy_id, name, type, icon, game_id, game_title, platform, external_id, cover, hero, account_label, completes_game]
            properties:
              trophy_id: { type: string, format: uuid }
              name: { type: string }
              description: { type: [string, "null"] }
              type: { $ref: "#/components/schemas/TrophyType" }
              icon: { type: string }
              rarity_pct: { type: [number, "null"] }
              earned_at: { type: [string, "null"], format: date-time }
              game_id: { type: string, format: uuid }
              game_title: { type: string }
              platform: { $ref: "#/components/schemas/Platform" }
              external_id: { type: string }
              cover: { type: string }
              hero: { type: string }
              account_label: { type: string }
              completes_game: { type: boolean, description: "Este desbloqueio fechou o jogo (platina/100%) na conta." }
        next_cursor: { type: [string, "null"] }
    Alert:
      type: object
      required: [trophy_id, name, type, hidden, icon, tags, server_shutdown_risk, game_id, game_title, platform]
      properties:
        trophy_id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/TrophyType" }
        hidden: { type: boolean }
        icon: { type: string }
        rarity_pct: { type: [number, "null"] }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TrophyTag" }
        server_shutdown_risk: { type: boolean }
        game_id: { type: string, format: uuid }
        game_title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
    GameAccount:
      type: object
      description: Uma conta que possui o jogo, com o progresso dela.
      required: [integration_id, label, display_name, game_id, progress]
      properties:
        integration_id: { type: string, format: uuid }
        label: { type: string }
        display_name: { type: string }
        game_id: { type: string, format: uuid, description: "Linha do jogo nesta conta (GET /games/{id})." }
        progress: { $ref: "#/components/schemas/ProgressSummary" }
    TypeCounts:
      type: object
      description: Troféus ganhos/total por tipo (PSN) e ganhos por tier de raridade — contadores do card.
      required: [platinum, gold, silver, bronze, rarity]
      properties:
        platinum: { $ref: "#/components/schemas/TypeCount" }
        gold: { $ref: "#/components/schemas/TypeCount" }
        silver: { $ref: "#/components/schemas/TypeCount" }
        bronze: { $ref: "#/components/schemas/TypeCount" }
        rarity: { $ref: "#/components/schemas/RarityEarned" }
    RarityEarned:
      type: object
      description: "Troféus GANHOS por tier — lendário < 1%, épico 1–5%, raro 5–20%, incomum 20–50%, comum ≥ 50%."
      required: [legendary, epic, rare, uncommon, common]
      properties:
        legendary: { type: integer }
        epic: { type: integer }
        rare: { type: integer }
        uncommon: { type: integer }
        common: { type: integer }
    GameListItem:
      description: >
        Um item por jogo: o jogo unificado (Steam + PSN, cross_platform = true) ou, sem vínculo,
        platform + external_id. Game/progress são da conta MAIS AVANÇADA — entre plataformas, quando
        unificado (id = game_id dela); accounts lista as contas da plataforma desse item, mais
        avançada primeiro. Com filtro de plataforma, aparece a versão daquela plataforma.
      allOf:
        - $ref: "#/components/schemas/Game"
        - type: object
          required: [progress, accounts, counts, cross_platform]
          properties:
            progress: { $ref: "#/components/schemas/ProgressSummary" }
            last_unlock_at: { type: [string, "null"], format: date-time, description: "Desbloqueio mais recente (conta best)." }
            counts: { $ref: "#/components/schemas/TypeCounts" }
            cross_platform: { type: boolean, description: "O jogo está vinculado ao mesmo título na outra plataforma." }
            accounts:
              type: array
              items: { $ref: "#/components/schemas/GameAccount" }
    GameListPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GameListItem" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    GameDetail:
      allOf:
        - $ref: "#/components/schemas/Game"
        - type: object
          required: [integration_id, account_label, progress, groups, accounts, cross_platform, unify_locked, estimate]
          properties:
            integration_id: { type: string, format: uuid, description: "Conta desta linha do jogo." }
            account_label: { type: string }
            progress: { $ref: "#/components/schemas/ProgressDetail" }
            groups:
              type: array
              items: { $ref: "#/components/schemas/TrophyGroup" }
            accounts:
              type: array
              description: Todas as contas que possuem o jogo (mais avançada primeiro).
              items: { $ref: "#/components/schemas/GameAccount" }
            cross_platform:
              type: array
              description: O mesmo jogo na outra plataforma (conta mais avançada), para ver lado a lado.
              items: { $ref: "#/components/schemas/CrossPlatformGame" }
            unify_locked: { type: boolean, description: "Vínculo decidido manualmente (a unificação automática não mexe)." }
            estimate:
              oneOf:
                - $ref: "#/components/schemas/GameEstimate"
                - type: "null"
    GameEstimate:
      type: object
      description: Tempos do HowLongToBeat para o título (horas). Preenchido em segundo plano.
      required: [main_h, extra_h, completionist_h, hours_left, source_url]
      properties:
        main_h: { type: [number, "null"], description: História principal. }
        extra_h: { type: [number, "null"], description: História + extras. }
        completionist_h: { type: [number, "null"], description: "100% (platina)." }
        hours_left: { type: [number, "null"], description: "Quanto falta para 100% (proporcional ao progresso)." }
        source_url: { type: string }
    LinkGameRequest:
      type: object
      required: [other_game_id]
      properties:
        other_game_id: { type: string, format: uuid, description: "Jogo da outra plataforma." }
    CrossPlatformGame:
      type: object
      required: [game_id, platform, external_id, title, cover, hero, earned, total, completion_pct, last_unlock_at]
      properties:
        game_id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        external_id: { type: string }
        title: { type: string }
        cover: { type: string }
        hero: { type: string }
        earned: { type: integer }
        total: { type: integer }
        completion_pct: { type: number, description: "0–1, pelo critério da plataforma." }
        last_unlock_at: { type: [string, "null"], format: date-time }
    TrophyGroup:
      type: object
      required: [id, external_id, name, is_base, trophies]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        is_base: { type: boolean }
        icon: { type: string }
        trophies:
          type: array
          items: { $ref: "#/components/schemas/Trophy" }
    Trophy:
      type: object
      required: [id, external_id, name, type, hidden, earned]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        description:
          type: [string, "null"]
          description: Null em troféus ocultos sem descrição (spoiler guard).
        type: { $ref: "#/components/schemas/TrophyType" }
        hidden: { type: boolean }
        icon: { type: string }
        icon_locked: { type: string }
        rarity_pct: { type: [number, "null"], format: double }
        earned: { type: boolean }
        earned_at: { type: [string, "null"], format: date-time }
        progress: { type: [integer, "null"] }
        target: { type: [integer, "null"] }
        priority: { type: integer }
        notes: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TrophyTag" }
        server_shutdown_risk: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        code:
          type: string
          description: >
            Código estável para a UI reagir: not_invited (sem convite aceito), member_removed (acesso
            revogado), invite_invalid, ai_daily_limit (teto diário de IA do membro).
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
